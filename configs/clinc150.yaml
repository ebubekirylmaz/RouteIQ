domain: clinc150
data_source: public

labels:
  - report_lost_card
  - damaged_card
  - card_declined
  - report_fraud
  - freeze_account
  - out_of_scope     

tiers:
  - name: baseline
    model: sklearn_tfidf_logreg
    accept_threshold: 0.7
  - name: llm
    model: openrouter
    model_id: mistralai/mistral-small-3.2-24b-instruct
    price_in_per_m: 0.09
    price_out_per_m: 0.30
    accept_threshold: 0.90
    timeout: 10
    max_attempts: 2

target:
  type: mock_erp
  url: http://localhost:8000/mock-erp/api/tickets 